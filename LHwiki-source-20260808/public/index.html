<html lang="zh-CN">
<head>

<body>
  <div id="app"><div class="boot">正在打开 LHwiki…</div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="login-dialog" class="dialog">
    <form id="login-form" method="dialog">
      <button class="icon-button dialog-close" value="cancel" aria-label="关闭">×</button>
      <span class="eyebrow">校内成员登入</span>
      <h2>输入九位学号</h2>
      <p class="muted">此学号仅用于筛选校内成员，不会以任何形式公开。</p>
      <label>学号<input name="studentId" autocomplete="username" maxlength="32" placeholder="请输入九位学号" required></label>
      <button class="button primary wide" type="submit">登入</button>
      <p class="form-error" data-login-error></p>
    </form>
  </dialog>
  <script type="module" src="/app.js?v=20260811-visit-batching"></script>
